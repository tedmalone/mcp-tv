[project]
name = "apple-tv-mcp"
version = "0.1.0"
description = "MCP server for Apple TV control via pyatv — power, volume, apps, navigation, text input"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pyatv>=0.16.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
apple-tv-mcp = "apple_tv_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = false
ignore_missing_imports = true

[tool.uv]
dev-dependencies = [
    "mypy>=1.11.2",
    "ruff>=0.6.8",
]
